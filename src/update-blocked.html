<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업데이트 실패 안내</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      font-size: 14px;
      padding: 24px;
      user-select: none;
    }
    .icon { font-size: 28px; margin-bottom: 12px; }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fab387;
      margin-bottom: 14px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #a6adc8;
      margin-bottom: 12px;
    }
    .steps {
      background: #313244;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .step {
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #cdd6f4;
    }
    .step:last-child { margin-bottom: 0; }
    .step-label {
      font-weight: 600;
      color: #89b4fa;
      display: block;
      margin-bottom: 2px;
    }
    .step-path {
      color: #a6adc8;
      font-size: 11px;
    }
    a {
      color: #89b4fa;
      text-decoration: underline;
      cursor: pointer;
    }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: #89b4fa;
      color: #1e1e2e;
    }
    .btn-primary:hover { background: #74c7ec; }
    .btn-secondary {
      background: #45475a;
      color: #cdd6f4;
    }
    .btn-secondary:hover { background: #585b70; }
  </style>
</head>
<body>
  <div class="icon">⚠️</div>
  <h1 id="failure-title">업데이트에 실패했습니다</h1>
  <p id="failure-guidance">업데이트 로그와 공식 릴리스를 확인한 뒤 다시 시도하세요.</p>

  <div class="steps">
    <div class="step">
      <span class="step-label">공식 릴리스 확인</span>
      <a id="link-github" href="#">https://github.com/asheept/auto-tong/releases/latest</a>
    </div>
  </div>

  <div class="actions">
    <button class="btn-secondary" id="btn-close">닫기</button>
  </div>

  <script>
    const { getCurrentWindow } = window.__TAURI__.window;
    const GITHUB_URL = "https://github.com/asheept/auto-tong/releases/latest";
    const guidance = {
      network: ["네트워크 연결 오류", "네트워크 연결을 확인한 뒤 다시 시도하세요."],
      signature: ["업데이트 파일 검증 실패", "공식 릴리스의 배포 상태를 확인하세요. 검증 오류가 계속되면 설치를 중단하세요."],
      permission: ["설치 권한 오류", "앱을 종료한 뒤 설치 권한과 파일 잠금을 확인하세요."],
      unknown: ["업데이트 실패", "업데이트 로그와 공식 릴리스를 확인한 뒤 다시 시도하세요."],
    };
    function showCategory(category) {
      const [title, action] = guidance[category] || guidance.unknown;
      document.getElementById("failure-title").textContent = title;
      document.getElementById("failure-guidance").textContent = action;
    }
    showCategory(new URLSearchParams(location.search).get("category"));
    window.__TAURI__.event.listen("update-failure-kind", (event) => showCategory(event.payload));

    document.getElementById("link-github").addEventListener("click", (e) => {
      e.preventDefault();
      navigator.clipboard.writeText(GITHUB_URL).then(() => {
        const el = document.getElementById("link-github");
        const original = el.textContent;
        el.textContent = "링크가 복사되었습니다!";
        setTimeout(() => { el.textContent = original; }, 1500);
      });
    });

    document.getElementById("btn-close").addEventListener("click", () => {
      getCurrentWindow().close();
    });
  </script>
</body>
</html>
