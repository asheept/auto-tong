schema: spec-driven

context: |
  Language: ko
  All artifacts must be written in ko.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: auto-tong, Windows-first Tauri 2 + Rust + plain JavaScript desktop app.
  Imports tagged ZIP/MRPACK archives from a synchronized folder into PrismLauncher.
  Preserve user saves, local settings, existing installations, and launcher running state.
  Source review baseline: 6463876 (0.2.9), reviewed on 2026-09-30.
  Distinguish observed behavior from proposed requirements and unverified assumptions.
  Current request authorizes implementation and verification; mark only verified tasks complete.
  Windows verification uses stable-x86_64-pc-windows-msvc; default GNU lacks dlltool here.

# Per-artifact rules (optional)
